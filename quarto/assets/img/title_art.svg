<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <!-- Title art: a magnet levitating over a superconductor cooled with liquid nitrogen.
       No background: it sits on the navy gradient of the theme's hero panel. -->
  <defs>
    <linearGradient id="mTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F4F8"/><stop offset="1" stop-color="#B9C0CC"/>
    </linearGradient>
    <linearGradient id="mFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5DAE3"/><stop offset="1" stop-color="#8C95A5"/>
    </linearGradient>
    <linearGradient id="mSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9AA3B2"/><stop offset="1" stop-color="#6B7486"/>
    </linearGradient>
    <linearGradient id="scTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A4562"/><stop offset="0.55" stop-color="#1D2438"/><stop offset="1" stop-color="#121829"/>
    </linearGradient>
    <linearGradient id="scSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#151B2C"/><stop offset="0.5" stop-color="#262F48"/><stop offset="1" stop-color="#0F1422"/>
    </linearGradient>
    <linearGradient id="dish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDE8FF" stop-opacity="0.22"/><stop offset="1" stop-color="#9DB7F0" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7FB2FF" stop-opacity="0.55"/><stop offset="1" stop-color="#7FB2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pairGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB25B" stop-opacity="0.9"/><stop offset="1" stop-color="#FFB25B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="fog" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="lineGlow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 z" fill="#9CC2FF"/>
    </marker>
  </defs>

  <!-- frost sparkles -->
  <g fill="#CFE0FF">
    <circle cx="70" cy="120" r="1.6" opacity="0.7"/><circle cx="150" cy="70" r="1.1" opacity="0.5"/>
    <circle cx="520" cy="110" r="1.8" opacity="0.7"/><circle cx="460" cy="190" r="1.2" opacity="0.5"/>
    <circle cx="95" cy="260" r="1.3" opacity="0.5"/><circle cx="545" cy="300" r="1.4" opacity="0.6"/>
    <circle cx="40" cy="420" r="1.2" opacity="0.5"/><circle cx="565" cy="470" r="1.1" opacity="0.5"/>
    <circle cx="260" cy="60" r="1.2" opacity="0.5"/><circle cx="360" cy="130" r="1.0" opacity="0.4"/>
    <circle cx="200" cy="170" r="1.0" opacity="0.4"/><circle cx="420" cy="60" r="1.3" opacity="0.6"/>
  </g>

  <!-- field lines of the magnet: out of the top face, back into the bottom face, squeezed
       above the superconductor (which expels them) -->
  <g fill="none" stroke="#8DB8FF" stroke-width="2.4" stroke-linecap="round">
    <g filter="url(#lineGlow)" opacity="0.55"><path d="M318,336 C328,250 450,230 470,390 C480,470 420,520 318,454"/><path d="M332,336 C342,205 505,190 520,380 C530,470 450,524 332,454"/><path d="M346,336 C356,160 560,150 570,370 C580,470 480,528 346,454"/><path d="M282,336 C272,250 150,230 130,390 C120,470 180,520 282,454"/><path d="M268,336 C258,205 95,190 80,380 C70,470 150,524 268,454"/><path d="M254,336 C244,160 40,150 30,370 C20,470 120,528 254,454"/></g>
    <g opacity="0.85"><path d="M318,336 C328,250 450,230 470,390 C480,470 420,520 318,454"/><path d="M332,336 C342,205 505,190 520,380 C530,470 450,524 332,454"/><path d="M346,336 C356,160 560,150 570,370 C580,470 480,528 346,454"/><path d="M282,336 C272,250 150,230 130,390 C120,470 180,520 282,454"/><path d="M268,336 C258,205 95,190 80,380 C70,470 150,524 268,454"/><path d="M254,336 C244,160 40,150 30,370 C20,470 120,528 254,454"/></g>
  </g>

  <!-- liquid-nitrogen dish -->
  <ellipse cx="300" cy="676" rx="250" ry="62" fill="url(#dish)" stroke="#BFD2FF" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M50,676 L64,724 A236,58 0 0 0 536,724 L550,676" fill="#9DB7F0" fill-opacity="0.07" stroke="#BFD2FF" stroke-opacity="0.3" stroke-width="2"/>

  <!-- glow under the levitating magnet -->
  <ellipse cx="300" cy="560" rx="200" ry="46" fill="url(#glow)" filter="url(#soft)"/>

  <!-- superconductor disc -->
  <path d="M120,612 L120,650 A180,40 0 0 0 480,650 L480,612 z" fill="url(#scSide)"/>
  <ellipse cx="300" cy="612" rx="180" ry="40" fill="url(#scTop)" stroke="#5B6C99" stroke-width="1.5"/>
  <!-- Cooper pairs glinting on its surface -->
  <g>
    <g transform="translate(220,606)"><circle r="14" fill="url(#pairGlow)"/><circle cx="-5" r="3.2" fill="#FFD9A8"/><circle cx="5" r="3.2" fill="#FFD9A8"/></g>
    <g transform="translate(310,622)"><circle r="14" fill="url(#pairGlow)"/><circle cx="-5" cy="1" r="3.2" fill="#FFD9A8"/><circle cx="5" cy="-1" r="3.2" fill="#FFD9A8"/></g>
    <g transform="translate(392,604)"><circle r="14" fill="url(#pairGlow)"/><circle cx="-4" cy="-3" r="3.2" fill="#FFD9A8"/><circle cx="4" cy="3" r="3.2" fill="#FFD9A8"/></g>
    <g transform="translate(270,590)" opacity="0.7"><circle r="11" fill="url(#pairGlow)"/><circle cx="-4" r="2.6" fill="#FFD9A8"/><circle cx="4" r="2.6" fill="#FFD9A8"/></g>
    <g transform="translate(355,594)" opacity="0.7"><circle r="11" fill="url(#pairGlow)"/><circle cx="-4" cy="2" r="2.6" fill="#FFD9A8"/><circle cx="4" cy="-2" r="2.6" fill="#FFD9A8"/></g>
  </g>

  <!-- nitrogen fog -->
  <g fill="#E8F0FF" filter="url(#fog)">
    <ellipse cx="120" cy="664" rx="80" ry="18" opacity="0.32"/>
    <ellipse cx="480" cy="660" rx="90" ry="20" opacity="0.3"/>
    <ellipse cx="300" cy="700" rx="200" ry="22" opacity="0.28"/>
    <ellipse cx="190" cy="720" rx="90" ry="16" opacity="0.25"/>
    <ellipse cx="420" cy="716" rx="100" ry="16" opacity="0.25"/>
    <ellipse cx="80" cy="630" rx="40" ry="12" opacity="0.2"/>
    <ellipse cx="530" cy="626" rx="44" ry="12" opacity="0.2"/>
  </g>

  <!-- levitating magnet (cube) -->
  <g>
    <polygon points="232,362 266,334 400,334 366,362" fill="url(#mTop)"/>
    <polygon points="366,362 400,334 400,424 366,452" fill="url(#mSide)"/>
    <rect x="232" y="362" width="134" height="90" fill="url(#mFront)"/>
    <line x1="232" y1="407" x2="366" y2="407" stroke="#7A8394" stroke-width="1.2" opacity="0.6"/>
    <polyline points="232,362 266,334 400,334" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>
</svg>
