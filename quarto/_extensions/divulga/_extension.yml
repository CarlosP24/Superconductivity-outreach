title: Divulgación ICMM-CSIC
author: Carlos Payá
version: 1.0.0
quarto-required: ">=1.6.0"
contributes:
  formats:
    revealjs:
      theme: [default, divulga.scss]
      css: [fonts/cabin.css]
      template-partials:
        - title-slide.html
      revealjs-plugins:
        - plugin
      html-math-method: gladtex
      width: 1600
      height: 900
      margin: 0
      min-scale: 0.2
      max-scale: 3.0
      center: false
      transition: fade
      transition-speed: fast
      background-transition: fade
      controls: false
      progress: true
      slide-number: c
      show-slide-number: all
      hash: true
      fragment-in-url: true
      navigation-mode: linear
      preview-links: false
      auto-stretch: false
      menu:
        side: left
        numbers: true
        hideMissingTitles: true
        openButton: false
